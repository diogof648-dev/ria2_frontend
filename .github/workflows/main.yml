name: CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Cache pub deps
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Set image tag from branch
        id: image-tag
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test" >> "$GITHUB_OUTPUT"
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗️ Build APKs
        run: flutter build apk --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --${{ steps.image-tag.outputs.type }} --split-per-abi

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-${{ steps.image-tag.outputs.type }}.apk artifacts/ria2-app-${{ steps.image-tag.outputs.tag }}.apk

  push-to-s3:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 mv artifacts/ria2-app-${{ steps.image-tag.outputs.tag }}.apk s3://${{ secrets.S3_BUCKET }}/ria2-app-${{ steps.image-tag.outputs.tag }}.apk