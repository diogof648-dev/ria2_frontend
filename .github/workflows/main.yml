name: CI

on: push

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.set-env.outputs.environment_name }}
      build_type: ${{ steps.set-env.outputs.build_type }}
    steps:
      - name: Set env from branch
        id: set-env
        run: |
          branch="${GITHUB_REF##*/}"
          echo "build_type=debug" >> "$GITHUB_OUTPUT"

          case "$branch" in
            main)
              echo "environment_name=PROD" >> "$GITHUB_OUTPUT"
              echo "build_type=release" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "environment_name=STAGE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "environment_name=DEV" >> "$GITHUB_OUTPUT"
              ;;
          esac
      
  build:
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: ${{ needs.prepare.outputs.environment_name }}
      deployment: false
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Cache pub deps
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: 🏗️ Build APK
        run: flutter build apk --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --${{ needs.prepare.outputs.build_type }}

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-${{ needs.prepare.outputs.build_type }}.apk artifacts/ria2-app.apk

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ria2-apks
          path: artifacts/*.apk

  push-to-s3:
    runs-on: ubuntu-latest
    needs: [build, prepare]
    environment:
      name: ${{ needs.prepare.outputs.environment_name }}
    steps:
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ria2-apks
          path: artifacts
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 mv artifacts/ria2-app.apk "s3://${{ secrets.S3_BUCKET }}/ria2-app.apk"
